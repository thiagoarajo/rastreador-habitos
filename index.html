<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador de Hábitos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🔥 Meus Hábitos</h1>
      <p class="subtitle" id="today-label"></p>
    </header>

    <form id="add-form" class="add-form">
      <input type="text" id="habit-input" placeholder="Novo hábito (ex: Beber água, Ler 10 páginas...)" maxlength="40" required>
      <button type="submit">Adicionar</button>
    </form>

    <div id="habit-list" class="habit-list"></div>

    <p id="empty-state" class="empty-state">Nenhum hábito ainda. Adicione o primeiro acima! ✨</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
